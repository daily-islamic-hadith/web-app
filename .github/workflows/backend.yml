name: backend

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hadith_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: hadith_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: 'sqlite:///:memory:'
      TEST_POSTGRES_URL: postgresql://hadith_test:test_password@127.0.0.1:5432/hadith_test
      OPENAI_API_KEY: test-key
      SECRET_KEY: test-session-secret-with-at-least-32-bytes
      JWT_SECRET_KEY: test-signing-secret-with-at-least-32-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
          cache: pip
          cache-dependency-path: |
            server/requirements.lock
            server/requirements-dev.lock
            scripts/requirements.lock
      - name: Install native driver prerequisites
        run: sudo apt-get update && sudo apt-get install -y libpq-dev gcc
      - name: Install locked dependency layers
        run: python -m pip install --require-hashes -r server/requirements.lock -r server/requirements-dev.lock -r scripts/requirements.lock
      - name: Check dependencies
        run: python -m pip check
      - name: Check runtime versions, backend, and disposable databases
        working-directory: server
        run: |
          python -m pytest tests/test_dependency_lock.py -q
          python -m pytest tests -q
          python -m flask --app hadith_app routes
      - name: Boot the Procfile entrypoint
        working-directory: server
        run: |
          gunicorn hadith_app:app --bind 127.0.0.1:8000 > "$RUNNER_TEMP/gunicorn.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; cat "$RUNNER_TEMP/gunicorn.log"' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/privacy-policy
      - name: Audit locked dependencies
        run: python -m pip_audit --require-hashes --disable-pip -r server/requirements.lock -r server/requirements-dev.lock -r scripts/requirements.lock
