version: 2
updates:
  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        update-types:
          - minor
          - patch
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
